name: Embedded HIL Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-embedded-qa-suite:
    name: Execute HIL Verification Layer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Automatically caches installed packages to speed up future runs

    - name: Install Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyvisa pyvisa-sim gpiozero

    - name: Run PyTest Automated Firmware/HIL Verification
      run: |
        pytest embedded_hil_test.py -v -s